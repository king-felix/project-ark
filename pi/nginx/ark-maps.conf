# =============================================================================
#  PROJECT ARK — the public maps origin, and nothing else
#
#  A page that must reopen with the Ark gone needs a secure origin the device
#  trusts.  This listener is that origin: HTTPS on :8446, the Ark's own
#  certificate, the maps application under /maps/, and a 404 for everything
#  else.  It does not proxy /admin, it does not serve the library, and it has no
#  upload door.
#
#  The same certificate as the owner's pages is used on purpose: a person who has
#  already trusted the Ark for administration does not have to trust a second
#  certificate to carry a map.  The key never leaves the box.
# =============================================================================

ssl_certificate     /etc/ssl/ark/ark-admin.crt;
ssl_certificate_key /etc/ssl/ark/ark-admin.key;

server {
    # default_server is deliberate: an address literal (10.42.0.1) sends no SNI,
    # and the certificate carries an IP SAN for exactly that case.  Unknown names
    # are still refused below.
    listen 8446 ssl http2 default_server;
    listen [::]:8446 ssl http2 default_server;

    server_name ark.lan ark.local ark 10.42.0.1 localhost 127.0.0.1;

    if ($host !~ ^(ark\.lan|ark\.local|ark|10\.42\.0\.1|localhost|127\.0\.0\.1)$) {
        return 444;
    }

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:arkmaps:1m;
    ssl_session_timeout 10m;

    client_max_body_size 4m;          # the public maps door never receives a body
    client_body_temp_path /srv/ark/tmp/nginx 1 2;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=0" always;   # not a global HSTS
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;

    access_log /var/log/nginx/ark-maps.access.log;
    error_log  /var/log/nginx/ark-maps.error.log warn;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml;
    gzip_min_length 512;

    # the one address a person types may omit the slash
    location = /maps { return 301 /maps/; }

    # the application, the catalogue, the pack bytes and the certificate.
    # Buffering is OFF because a pack is read with Range requests on a phone;
    # nginx must pass the 206 and the Content-Range through untouched.
    location ^~ /maps/ {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-ARK-Setup-Channel "";
        proxy_set_header Range             $http_range;
        proxy_set_header If-Range          $http_if_range;
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
        proxy_buffering     off;
        proxy_request_buffering off;
    }

    location = /favicon.ico { access_log off; log_not_found off; return 204; }

    # everything else on this origin is simply not here
    location / { return 404; }
}
