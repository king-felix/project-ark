# =============================================================================
#  PROJECT ARK — nginx reverse proxy + captive-portal trigger
#  Installed to /etc/nginx/sites-available/ark, symlinked into sites-enabled.
#  Listens on :80 for every Host header (wildcard DNS points *anything* here).
# =============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream ark_kiwix   { server 127.0.0.1:8081; keepalive 16; }
upstream ark_calibre { server 127.0.0.1:8083; keepalive 16; }
upstream ark_api     { server 127.0.0.1:8085; keepalive 16; }

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name ark.lan ark.local ark 10.42.0.1 _;

    root  /srv/ark/portal;
    index index.html;

    charset utf-8;
    charset_types text/css application/javascript application/json text/plain;

    # NOTE: never declare a `types {}` block here — it would replace nginx's
    # whole MIME table for this server and every .html/.css would be served as
    # application/octet-stream.  Extra types are added per-location instead.

    # 2 GiB is the most the portal will store in one upload. nginx allows 16 MiB
    # on top for multipart framing, and not a byte more: a body the backend is
    # going to refuse must never be read off the network first.
    client_max_body_size 2064m;       # ark_storage.MAX_FILE (2 GiB) + 16 MiB framing
    client_body_timeout  300s;
    send_timeout         300s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/xml image/svg+xml;
    gzip_min_length 512;

    access_log /var/log/nginx/ark.access.log;
    error_log  /var/log/nginx/ark.error.log warn;

    # -------------------------------------------------------------------------
    #  CAPTIVE PORTAL PROBES
    #  A 302 (not a 204) is what makes phones/laptops show the
    #  "Sign in to network" sheet that opens THE ARK automatically.
    # -------------------------------------------------------------------------
    location = /hotspot-detect.html          { return 302 "http://ark.lan/?captive=1"; }
    location = /library/test/success.html    { return 302 "http://ark.lan/?captive=1"; }
    location = /success.txt                  { return 302 "http://ark.lan/?captive=1"; }
    location = /generate_204                 { return 302 "http://ark.lan/?captive=1"; }
    location = /gen_204                      { return 302 "http://ark.lan/?captive=1"; }
    location = /connecttest.txt              { return 302 "http://ark.lan/?captive=1"; }
    location = /ncsi.txt                     { return 302 "http://ark.lan/?captive=1"; }
    location = /redirect                     { return 302 "http://ark.lan/?captive=1"; }
    location = /canonical.html               { return 302 "http://ark.lan/?captive=1"; }
    location = /nmcheck.gnome.org/check_network_status.txt { return 302 "http://ark.lan/?captive=1"; }

    # -------------------------------------------------------------------------
    #  ADMINISTRATION LIVES ELSEWHERE
    #  The owner's pages are only served on the HTTPS management listener
    #  (:8443, and :8444 over an SSH tunnel).  Answering 404 here — rather than
    #  proxying — is what keeps an administrator password off plain HTTP.
    # -------------------------------------------------------------------------
    location ^~ /admin { return 404; }

    # -------------------------------------------------------------------------
    #  PORTAL PAGES BUILT ON THE FLY  (one search box, message board, file box)
    #  These three live in the backend so they work without any JavaScript.
    # -------------------------------------------------------------------------
    location ~ ^/(search|board|files)$ {
        proxy_pass http://ark_api;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_request_buffering off;      # uploads stream straight to the disk
    }

    # -------------------------------------------------------------------------
    #  PORTAL (static Command Center)
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # -------------------------------------------------------------------------
    #  OFFLINE ENCYCLOPEDIAS  (kiwix-serve already emits /kiwix/… links)
    # -------------------------------------------------------------------------
    location /kiwix/ {
        proxy_pass http://ark_kiwix;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range             $http_range;
        proxy_set_header If-Range          $http_if_range;
        proxy_redirect off;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    # -------------------------------------------------------------------------
    #  BOOK LIBRARY  (Calibre-Web sees itself at the /books sub-path)
    # -------------------------------------------------------------------------
    location /books {
        proxy_pass http://ark_calibre;
        proxy_http_version 1.1;
        proxy_set_header Connection         "";
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Script-Name      /books;
        proxy_set_header X-Forwarded-Prefix /books;
        proxy_redirect http://$host/ /books/;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    # -------------------------------------------------------------------------
    #  BACKEND API
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://ark_api;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # -------------------------------------------------------------------------
    #  VAULT  (manuals, guides, installable apps)
    #  ^~ so the block wins over the portal's static handler.
    # -------------------------------------------------------------------------
    location ^~ /vault/ {
        alias /srv/ark/vault/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        add_header Cache-Control "max-age=3600" always;
    }
    location = /vault { return 301 /vault/; }

    # Android app packages: an empty types{} resets the map so default_type wins.
    location ~* \.apk$ {
        types { }
        default_type application/vnd.android.package-archive;
    }

    # -------------------------------------------------------------------------
    #  SHARED FILE BOX  (direct download links)
    # -------------------------------------------------------------------------
    location /drop/ {
        alias /srv/ark/drop/files/;
        autoindex off;
    }

    location = /favicon.ico { access_log off; log_not_found off; return 204; }
}
