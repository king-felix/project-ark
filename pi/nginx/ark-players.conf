# =============================================================================
#  PROJECT ARK — the player's own origin (a name, a password, saves)
#
#  Installed to /etc/nginx/sites-available/ark-players and symlinked into
#  sites-enabled by phase 65-admin, after the box's certificate exists.
#
#     :8445   HTTPS only.  Serves /arcade/ and the stylesheet the pages use.
#
#  Why a second listener: a password and a save must not travel over the plain
#  portal on :80.  The public shelf is still there for guests; this origin is
#  where a person signs in, keeps a save, exports one and imports one.  It sets
#  X-ARK-Player-Origin: 1, which is the header the backend trusts; the public
#  portal blanks the same header, so a visitor cannot invent it.
#
#  This is not the administrator origin.  /admin is answered 404 here, exactly
#  as it is on :80, and a player's cookie cannot be used there.
# =============================================================================

server {
    listen 8445 ssl http2;
    listen [::]:8445 ssl http2;

    ssl_certificate     /etc/ssl/ark/ark-admin.crt;
    ssl_certificate_key /etc/ssl/ark/ark-admin.key;

    server_name ark.lan ark.local ark 10.42.0.1 localhost 127.0.0.1;

    if ($host !~ ^(ark\.lan|ark\.local|ark|10\.42\.0\.1|localhost|127\.0\.0\.1)$) {
        return 444;
    }

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:arkplay:1m;
    ssl_session_timeout 10m;

    client_max_body_size 40m;          # save import is capped at 32 MiB by the app
    client_body_timeout 60s;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=0" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    access_log /var/log/nginx/ark-players.access.log;
    error_log  /var/log/nginx/ark-players.error.log warn;

    # The stylesheet and logo the arcade pages reference by absolute path.
    location ^~ /assets/ {
        alias /srv/ark/portal/assets/;
        autoindex off;
        add_header Cache-Control "no-cache" always;
    }

    # The whole shelf on the secure origin: reading, playing, signing in, saves.
    # One game a visitor picked needs more room than a save (64 MB + framing),
    # so that one exact path is named here as well as on the public portal.
    location = /arcade/add {
        client_max_body_size 68m;
        client_body_timeout 600s;

        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Connection            "";
        proxy_set_header Host                  $host;
        proxy_set_header X-Real-IP             $remote_addr;
        proxy_set_header X-Forwarded-For       $remote_addr;
        proxy_set_header X-Forwarded-Proto     https;
        proxy_set_header X-Forwarded-Port      8445;
        proxy_set_header X-ARK-Player-Origin   1;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location ^~ /arcade/ {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Connection            "";
        proxy_set_header Host                  $host;
        proxy_set_header X-Real-IP             $remote_addr;
        proxy_set_header X-Forwarded-For       $remote_addr;
        proxy_set_header X-Forwarded-Proto     https;
        proxy_set_header X-Forwarded-Port      8445;
        proxy_set_header X-ARK-Player-Origin   1;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location = /arcade { return 301 https://$host:8445/arcade/; }

    # Links back to the public half are plain reading, not a second copy of it.
    location = / { return 302 http://$host/; }
    location ~ ^/(files|board|search)$ { return 302 http://$host$request_uri; }

    location = /favicon.ico { access_log off; return 204; }

    # Never administration, never a directory listing, nothing else.
    location ^~ /admin { return 404; }
    location / { return 404; }
}
