# =============================================================================
#  PROJECT ARK — administration over HTTPS, on its own origin
#
#  Installed to /etc/nginx/sites-available/ark-admin and symlinked into
#  sites-enabled.  Two listeners, both serving ONLY the admin area:
#
#     :8443   the management origin the owner opens from a phone or laptop
#     :8444   loopback only.  It exists so a box that has never been claimed can
#             be set up through an SSH tunnel, which is the only way the public
#             temporary password can be used without handing it to every
#             stranger on the open hotspot.
#
#  Nothing else is served here: no library, no books, no shared files.  And the
#  plain-HTTP portal on :80 never proxies /admin at all, so a password can not
#  travel unencrypted even by accident.
# =============================================================================

ssl_certificate     /etc/ssl/ark/ark-admin.crt;
ssl_certificate_key /etc/ssl/ark/ark-admin.key;

# ---- the management origin the owner uses -----------------------------------
server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;

    server_name ark.lan ark.local ark 10.42.0.1 localhost 127.0.0.1;

    # A Host header we do not recognise gets nothing at all.
    if ($host !~ ^(ark\.lan|ark\.local|ark|10\.42\.0\.1|localhost|127\.0\.0\.1)$) {
        return 444;
    }

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:arkadmin:1m;
    ssl_session_timeout 10m;

    client_max_body_size 128k;        # admin forms are tiny; uploads happen on :80
    client_body_timeout 30s;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=0" always;   # not a global HSTS
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    access_log /var/log/nginx/ark-admin.access.log;
    error_log  /var/log/nginx/ark-admin.error.log warn;

    # stylesheets the admin pages use (public files, no secrets)
    location ^~ /assets/ {
        alias /srv/ark/portal/assets/;
        autoindex off;
        add_header Cache-Control "no-cache" always;
    }

    # the whole administrator area, and nothing else
    location ^~ /admin {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Connection          "";
        proxy_set_header Host                $host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $remote_addr;   # overwritten, not appended
        proxy_set_header X-Forwarded-Proto   https;
        proxy_set_header X-Forwarded-Host    $host;
        # never let a client claim it arrived on the private setup channel
        proxy_set_header X-ARK-Setup-Channel "";
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location = /favicon.ico { access_log off; return 204; }

    # everything else on this origin is simply not here
    location / { return 404; }
}

# ---- loopback only: first-run setup through an SSH tunnel -------------------
server {
    listen 127.0.0.1:8444 ssl http2;

    server_name localhost 127.0.0.1 ark.lan;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:arkadmin:1m;

    client_max_body_size 128k;
    server_tokens off;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    access_log /var/log/nginx/ark-admin.conf.access.log;
    error_log  /var/log/nginx/ark-admin.conf.error.log warn;

    location ^~ /assets/ {
        alias /srv/ark/portal/assets/;
        autoindex off;
    }

    location ^~ /admin {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Connection          "";
        proxy_set_header Host                $host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $remote_addr;
        proxy_set_header X-Forwarded-Proto   https;
        # this listener is the private channel — the API checks the peer address too
        proxy_set_header X-ARK-Setup-Channel loopback;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location / { return 404; }
}

# ---- catch-all: unknown names and IP literals on the management port --------
server {
    listen 8443 ssl http2 default_server;
    listen [::]:8443 ssl http2 default_server;
    server_name _;
    ssl_reject_handshake on;
}
